name: Bug 报告
description: 报告可以稳定复现的游戏问题
title: "[Bug] "
labels:
  - bug
body:
  - type: textarea
    id: problem
    attributes:
      label: 问题描述
      description: 实际发生了什么？你原本期待什么？
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      placeholder: |
        1. 选择科目和难度……
        2. 操作……
        3. 看到……
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 环境
      description: 设备、系统、浏览器或小红书客户端版本
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 截图或补充信息
