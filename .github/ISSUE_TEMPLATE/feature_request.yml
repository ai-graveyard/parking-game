name: 功能建议
description: 提议新的玩法、体验或维护改进
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: motivation
    attributes:
      label: 想解决的问题
      description: 请先描述使用场景和现有体验的不足。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
